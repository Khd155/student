<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استعلام لجان الاختبارات</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

body {
  min-height:100vh;
  font-family:'Segoe UI',Tahoma,Arial,sans-serif;
  direction:rtl;
  background: linear-gradient(120deg, #4a7fa5 0%, #4aad96 100%);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:48px 16px 24px;
}

/* ── MOE LOGO ── */
.moe-header {
  text-align:center;
  margin-bottom:28px;
}
.moe-logo-wrap {
  margin-bottom:14px;
}
.moe-logo {
  display:inline-block;
}
/* SVG dots logo */
.moe-name {
  font-size:26px;
  font-weight:300;
  color:#fff;
  letter-spacing:.04em;
  margin-bottom:4px;
}
.moe-name-en {
  font-size:13px;
  color:rgba(255,255,255,.7);
  letter-spacing:.08em;
}
.moe-region {
  font-size:12px;
  font-weight:600;
  color:#fff;
  margin-top:14px;
  opacity:.75;
  letter-spacing:.02em;
}

/* ── SCHOOL NAME ── */
.school-name {
  font-size:20px;
  font-weight:700;
  color:#fff;
  margin-top:6px;
  margin-bottom:32px;
  text-align:center;
  opacity:1;
}

/* ── SEARCH CARD ── */
.card {
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.25);
  border-radius:20px;
  padding:32px 28px 28px;
  width:100%;
  max-width:480px;
}
.card-title {
  font-size:14px;
  font-weight:600;
  color:rgba(255,255,255,.8);
  margin-bottom:10px;
  text-align:center;
}
.input-row {
  display:flex;
  gap:10px;
  margin-bottom:10px;
}
.id-input {
  flex:1;
  background:rgba(255,255,255,.15);
  border:1.5px solid rgba(255,255,255,.3);
  border-radius:12px;
  padding:0 18px;
  height:54px;
  font-size:20px;
  font-weight:700;
  color:#fff;
  direction:ltr;
  text-align:center;
  letter-spacing:.06em;
  outline:none;
  transition:.2s;
  font-family:'Courier New',monospace;
}
.id-input::placeholder {
  color:rgba(255,255,255,.45);
  font-size:13px;
  font-weight:400;
  letter-spacing:0;
  font-family:'Segoe UI',sans-serif;
}
.id-input:focus {
  background:rgba(255,255,255,.22);
  border-color:rgba(255,255,255,.7);
  box-shadow:0 0 0 4px rgba(255,255,255,.15);
}
.search-btn {
  width:54px;
  height:54px;
  background:rgba(255,255,255,.2);
  border:1.5px solid rgba(255,255,255,.4);
  border-radius:12px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  transition:.2s;
  flex-shrink:0;
}
.search-btn:hover {
  background:rgba(255,255,255,.3);
  transform:scale(1.05);
}
.search-btn:active { transform:scale(.97); }
.hint {
  text-align:center;
  font-size:12px;
  color:rgba(255,255,255,.55);
}
.note {
  text-align:center;
  font-size:12px;
  color:rgba(255,255,255,.8);
  font-weight:600;
  margin-top:8px;
}

/* ── RESULTS ── */
.result-wrap {
  width:100%;
  max-width:480px;
  margin-top:16px;
}

.state-card {
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
  border-radius:16px;
  padding:36px 20px;
  text-align:center;
}
.state-icon { font-size:44px; margin-bottom:10px; }
.state-title { font-size:15px; font-weight:600; color:#fff; margin-bottom:4px; }
.state-sub { font-size:13px; color:rgba(255,255,255,.6); }

.result-card {
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 16px 48px rgba(0,0,0,.18);
  animation:pop .3s ease;
}
@keyframes pop {
  from{opacity:0;transform:translateY(12px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.result-top {
  background: linear-gradient(120deg, #4a7fa5, #4aad96);
  padding:22px 22px 20px;
  display:flex;
  align-items:center;
  gap:14px;
}
.avatar {
  width:52px;height:52px;border-radius:14px;
  background:rgba(255,255,255,.2);
  border:2px solid rgba(255,255,255,.4);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;color:#fff;flex-shrink:0;
}
.student-name { font-size:16px;font-weight:700;color:#fff;line-height:1.3;margin-bottom:3px; }
.student-id-lbl { font-size:11px;color:rgba(255,255,255,.7);direction:ltr;display:inline-block; }

.result-body { padding:18px 20px 20px; }
.info-grid { display:grid;grid-template-columns:1fr 1fr;gap:10px; }
.info-item {
  background:#f8faff;
  border-radius:11px;
  padding:13px 14px;
  border:1px solid #e8eef8;
}
.info-label { font-size:11px;color:#94a3b8;font-weight:600;margin-bottom:4px;letter-spacing:.03em; }
.info-value { font-size:14px;font-weight:700;color:#1e293b; }
.info-item.accent { background:#e8f4ff;border-color:#b9d9f5; }
.info-item.accent .info-label { color:#3b82f6; }
.info-item.accent .info-value { color:#1d4ed8; }

.seat-row {
  display:flex;align-items:center;justify-content:center;
  gap:8px;margin-top:14px;
  background:#f0fdf4;border:1.5px solid #86efac;border-radius:10px;
  padding:11px;
}
.seat-label { font-size:13px;color:#15803d; }
.seat-num { font-size:20px;font-weight:800;color:#15803d; }

/* loading */
.loading {
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:28px;color:rgba(255,255,255,.8);font-size:14px;
}
.spinner {
  width:22px;height:22px;border:3px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── FOOTER ── */
.site-footer {
  width:100%;
  text-align:center;
  margin-top:auto;
  padding-top:40px;
}
.site-footer p {
  font-size:13px;
  font-weight:600;
  color:rgba(255,255,255,.75);
}

@media(max-width:440px){
  .card{padding:24px 16px 20px}
  .result-body{padding:14px 14px 16px}
  .info-grid{grid-template-columns:1fr 1fr}
  .moe-name{font-size:22px}
}
</style>
</head>
<body>

<!-- MOE HEADER -->
<div class="moe-header">
  <div class="moe-logo-wrap">
    <img class="moe-logo" src="/MOH.png" alt="وزارة التعليم" width="220">
  </div>
  <div class="moe-region">الإدارة العامة للتعليم بمحافظة جدة</div>
</div>

<div class="school-name">مدرسة عبدالرحمن بن أبي بكر الابتدائية</div>

<!-- SEARCH CARD -->
<div class="card">
  <div class="card-title">الاستعلام عن لجنة الاختبار</div>
  <div class="input-row">
    <input
      type="text"
      id="idInput"
      class="id-input"
      placeholder="أدخل رقم الهوية"
      inputmode="numeric"
      pattern="[0-9]*"
      maxlength="10"
      autocomplete="off"
    />
    <button class="search-btn" onclick="doSearch()" aria-label="بحث">🔍</button>
  </div>
  <div class="hint">اضغط Enter أو زر البحث بعد إدخال الرقم</div>
  <div class="note">الرجاء استخدام رقم الهوية المدوّن في نظام نور</div>
</div>

<!-- RESULTS -->
<div class="result-wrap" id="resultWrap" style="display:none"></div>

<!-- FOOTER -->
<footer class="site-footer">
  <p>إدارة مدرسة عبدالرحمن بن أبي بكر الابتدائية</p>
</footer>

<script>
function getInitials(n){
  const w=n.trim().split(/\s+/);
  return w.length>=2?w[0][0]+w[1][0]:w[0].slice(0,2);
}

async function doSearch(){
  const q=document.getElementById('idInput').value.trim();
  const wrap=document.getElementById('resultWrap');
  wrap.style.display='block';

  if(!q){
    wrap.innerHTML=`<div class="state-card"><div class="state-icon">🔑</div><div class="state-title">الرجاء إدخال رقم الهوية</div><div class="state-sub">أدخل رقم الهوية ثم اضغط بحث</div></div>`;
    return;
  }

  wrap.innerHTML=`<div class="loading"><div class="spinner"></div>جاري البحث...</div>`;

  try {
    const res = await fetch(`/api/search?id=${encodeURIComponent(q)}`);
    const data = await res.json();

    if(!data.found){
      wrap.innerHTML=`<div class="state-card"><div class="state-icon">❌</div><div class="state-title">لا توجد نتيجة</div><div class="state-sub">لم يُعثر على طالب برقم الهوية: <strong style="color:#fff">${q}</strong></div></div>`;
      return;
    }

    const s=data.students[0];
    wrap.innerHTML=`
    <div class="result-card">
      <div class="result-top">
        <div class="avatar">${getInitials(s.name)}</div>
        <div>
          <div class="student-name">${s.name}</div>
          <span class="student-id-lbl">رقم الهوية: ${s.id}</span>
        </div>
      </div>
      <div class="result-body">
        <div class="info-grid">
          <div class="info-item accent">
            <div class="info-label">📋 اللجنة</div>
            <div class="info-value">اللجنة ${s.committee}</div>
          </div>
          <div class="info-item accent">
            <div class="info-label">📍 مقر اللجنة</div>
            <div class="info-value">${s.location}</div>
          </div>
          <div class="info-item">
            <div class="info-label">📚 الصف</div>
            <div class="info-value">${s.grade}</div>
          </div>
          <div class="info-item">
            <div class="info-label">🚪 الفصل</div>
            <div class="info-value">فصل ${s.class}</div>
          </div>
        </div>
        <div class="seat-row">
          <span class="seat-label">🎫 رقم الجلوس</span>
          <span class="seat-num">${s.seat}</span>
        </div>
      </div>
    </div>`;
  } catch(e){
    wrap.innerHTML=`<div class="state-card"><div class="state-icon">⚠️</div><div class="state-title">خطأ في الاتصال</div><div class="state-sub">${e.message}</div></div>`;
  }
}

document.getElementById('idInput').addEventListener('keydown',e=>{
  if(e.key==='Enter') doSearch();
});
document.getElementById('idInput').addEventListener('input',e=>{
  e.target.value=e.target.value.replace(/\D/g,'').slice(0,10);
});
</script>
</body>
</html>
