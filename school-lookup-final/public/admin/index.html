<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - استعلام لجان الاختبارات</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Segoe UI',Tahoma,Arial,sans-serif;
  direction:rtl;
  background: linear-gradient(120deg, #4a7fa5 0%, #4aad96 100%);
  min-height:100vh;
  color:#1e293b;
}

/* ── LOGIN ── */
.login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background: linear-gradient(120deg, #4a7fa5 0%, #4aad96 100%);
}
.login-card{
  background:rgba(255,255,255,.12);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.25);border-radius:18px;
  padding:32px 28px;width:100%;max-width:340px;text-align:center;
}
.login-card h1{color:#fff;font-size:18px;margin-bottom:18px;font-weight:700}
.login-card input{
  width:100%;height:48px;border-radius:10px;border:1.5px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.15);color:#fff;text-align:center;font-size:16px;
  padding:0 14px;margin-bottom:12px;outline:none;
}
.login-card input::placeholder{color:rgba(255,255,255,.6)}
.login-card button{
  width:100%;height:46px;border-radius:10px;border:none;cursor:pointer;
  background:#fff;color:#2d6a73;font-weight:700;font-size:15px;
  transition:.2s;
}
.login-card button:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.15)}
.login-err{color:#fecaca;font-size:13px;margin-top:10px;display:none}

/* ── LAYOUT ── */
.dash{display:none;min-height:100vh}
.topbar{
  background:rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 26px;position:sticky;top:0;z-index:10;
}
.topbar h1{font-size:17px;font-weight:700;color:#fff}
.topbar-right{display:flex;align-items:center;gap:14px}
.logout-btn{
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);border-radius:9px;padding:9px 18px;
  cursor:pointer;font-size:13px;color:#fff;font-weight:600;transition:.15s;
}
.logout-btn:hover{background:rgba(255,255,255,.25)}

.tabs{
  display:flex;gap:6px;background:rgba(255,255,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.15);
  padding:0 26px;position:sticky;top:65px;z-index:9;
}
.tab-btn{
  background:none;border:none;cursor:pointer;font-size:14px;font-weight:600;
  color:rgba(255,255,255,.65);padding:15px 18px;border-bottom:3px solid transparent;
  transition:.15s;
}
.tab-btn:hover{color:#fff}
.tab-btn.active{color:#fff;border-bottom-color:#fff}

.page{display:none;max-width:1100px;margin:0 auto;padding:28px 20px 60px}
.page.active{display:block}

/* ── STATS ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:22px}
.stat-card{
  background:rgba(255,255,255,.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:16px;padding:22px;border:1px solid rgba(255,255,255,.25);
  display:flex;align-items:center;gap:14px;
}
.stat-card .icon{
  width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);
}
.stat-card .num{font-size:27px;font-weight:800;color:#fff;line-height:1.1}
.stat-card .lbl{font-size:12.5px;color:rgba(255,255,255,.75);margin-top:3px}

.panel{background:#fff;border-radius:18px;padding:22px;box-shadow:0 16px 48px rgba(0,0,0,.18);margin-bottom:22px}
.panel h2{font-size:15px;margin-bottom:16px;font-weight:700;color:#0f172a}

.grade-table{width:100%;border-collapse:collapse;font-size:13.5px}
.grade-table th,.grade-table td{padding:10px 12px;text-align:right;border-bottom:1px solid #f1f5f9}
.grade-table th{color:#64748b;font-weight:600;font-size:12.5px}
.grade-table tr:last-child td{border-bottom:none}
.grade-table td:last-child{font-weight:700;color:#1d4ed8}

/* ── STUDENTS ── */
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:180px;height:42px;border-radius:10px;border:1px solid #e2e8f0;padding:0 14px;font-size:14px;outline:none;transition:.15s}
.toolbar input:focus{border-color:#1d4ed8;box-shadow:0 0 0 3px rgba(29,78,216,.1)}
.toolbar button{height:42px;padding:0 18px;border-radius:10px;border:none;cursor:pointer;font-size:13.5px;font-weight:700;transition:.15s}
.btn-primary{background:linear-gradient(120deg,#4a7fa5,#4aad96);color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.btn-secondary{background:#f1f5f9;color:#334155}
.btn-secondary:hover{background:#e2e8f0}

table.students{width:100%;border-collapse:collapse;font-size:13.5px}
table.students th,table.students td{padding:11px 10px;text-align:right;border-bottom:1px solid #f1f5f9;white-space:nowrap}
table.students th{color:#64748b;font-weight:600;background:#f8fafc;font-size:12px}
table.students tr:hover td{background:#f8fafc}
.row-actions button{
  border:none;background:none;cursor:pointer;font-size:13px;padding:5px 10px;border-radius:6px;font-weight:600;
}
.row-actions .edit{color:#1d4ed8}
.row-actions .edit:hover{background:#dbeafe}
.row-actions .del{color:#dc2626}
.row-actions .del:hover{background:#fee2e2}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid #f1f5f9}
.empty-state{text-align:center;padding:40px 0;color:#94a3b8;font-size:13.5px}

/* modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{margin-bottom:18px;font-size:16px;font-weight:700}
.modal label{display:block;font-size:12px;color:#64748b;font-weight:600;margin-bottom:5px;margin-top:12px}
.modal input{width:100%;height:42px;border:1px solid #e2e8f0;border-radius:9px;padding:0 12px;font-size:14px;outline:none;transition:.15s}
.modal input:focus{border-color:#1d4ed8;box-shadow:0 0 0 3px rgba(29,78,216,.1)}
.modal input:disabled{background:#f8fafc;color:#94a3b8}
.modal-actions{display:flex;gap:10px;margin-top:22px}
.modal-actions button{flex:1;height:44px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:14px}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <h1>لوحة تحكم المسؤول</h1>
    <input type="password" id="passwordInput" placeholder="كلمة المرور">
    <button onclick="login()">دخول</button>
    <div class="login-err" id="loginErr">كلمة المرور غير صحيحة</div>
  </div>
</div>

<div class="dash" id="dash">
  <div class="topbar">
    <h1>لوحة تحكم استعلام لجان الاختبارات</h1>
    <div class="topbar-right">
      <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabBtnStats" onclick="switchTab('stats')">الإحصائيات</button>
    <button class="tab-btn" id="tabBtnStudents" onclick="switchTab('students')">الطلاب</button>
  </div>

  <div class="page active" id="pageStats">
    <div class="stat-grid" id="statGrid"></div>
    <div class="panel">
      <h2>عدد الطلاب حسب الصف</h2>
      <table class="grade-table" id="gradeTable"></table>
    </div>
  </div>

  <div class="page" id="pageStudents">
    <div class="panel">
      <h2>إدارة الطلاب</h2>
      <div class="toolbar">
        <input type="text" id="searchBox" placeholder="بحث بالاسم أو رقم الهوية">
        <button class="btn-secondary" onclick="loadStudents()">بحث</button>
        <button class="btn-primary" onclick="openModal()">+ إضافة طالب</button>
      </div>
      <div class="table-wrap">
        <table class="students">
          <thead>
            <tr><th>الهوية</th><th>الاسم</th><th>الجلوس</th><th>اللجنة</th><th>المقر</th><th>الصف</th><th>الفصل</th><th></th></tr>
          </thead>
          <tbody id="studentsBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">إضافة طالب</h3>
    <label>رقم الهوية</label>
    <input id="f_id" type="text">
    <label>الاسم</label>
    <input id="f_name" type="text">
    <label>رقم الجلوس</label>
    <input id="f_seat" type="text">
    <label>اللجنة</label>
    <input id="f_committee" type="text">
    <label>مقر اللجنة</label>
    <input id="f_location" type="text">
    <label>الصف</label>
    <input id="f_grade" type="text">
    <label>الفصل</label>
    <input id="f_class" type="text">
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">إلغاء</button>
      <button class="btn-primary" onclick="saveStudent()">حفظ</button>
    </div>
  </div>
</div>

<script>
let editingId = null;

async function checkAuth(){
  const res = await fetch('/api/admin/me');
  const data = await res.json();
  if(data.authenticated){
    showDash();
  }
}

async function login(){
  const password = document.getElementById('passwordInput').value;
  const res = await fetch('/api/admin/login', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ password })
  });
  if(res.ok){
    showDash();
  } else {
    document.getElementById('loginErr').style.display = 'block';
  }
}

async function logout(){
  await fetch('/api/admin/logout', { method:'POST' });
  document.getElementById('dash').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

function showDash(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dash').style.display = 'block';
  loadStats();
  loadStudents();
}

function switchTab(tab){
  document.getElementById('pageStats').classList.toggle('active', tab === 'stats');
  document.getElementById('pageStudents').classList.toggle('active', tab === 'students');
  document.getElementById('tabBtnStats').classList.toggle('active', tab === 'stats');
  document.getElementById('tabBtnStudents').classList.toggle('active', tab === 'students');
}

async function loadStats(){
  const res = await fetch('/api/admin/stats');
  if(!res.ok) return;
  const data = await res.json();

  document.getElementById('statGrid').innerHTML = `
    <div class="stat-card"><div class="icon">👁️</div><div><div class="num">${data.pageViews}</div><div class="lbl">عدد زيارات الموقع</div></div></div>
    <div class="stat-card"><div class="icon">🔍</div><div><div class="num">${data.searches}</div><div class="lbl">عدد عمليات البحث</div></div></div>
    <div class="stat-card"><div class="icon">🎓</div><div><div class="num">${data.totalStudents}</div><div class="lbl">إجمالي عدد الطلاب</div></div></div>
  `;

  document.getElementById('gradeTable').innerHTML = `
    <tr><th>الصف</th><th>عدد الطلاب</th></tr>
    ${data.byGrade.map(g => `<tr><td>${g.grade}</td><td>${g.count}</td></tr>`).join('')}
  `;
}

async function loadStudents(){
  const q = document.getElementById('searchBox').value.trim();
  const url = q ? `/api/admin/students?q=${encodeURIComponent(q)}` : '/api/admin/students';
  const res = await fetch(url);
  if(!res.ok) return;
  const data = await res.json();

  if(!data.students.length){
    document.getElementById('studentsBody').innerHTML = `<tr><td colspan="8"><div class="empty-state">لا يوجد طلاب مطابقون</div></td></tr>`;
    return;
  }

  document.getElementById('studentsBody').innerHTML = data.students.map(s => `
    <tr>
      <td>${s.id}</td><td>${s.name}</td><td>${s.seat}</td><td>${s.committee}</td>
      <td>${s.location}</td><td>${s.grade}</td><td>${s.class}</td>
      <td class="row-actions">
        <button class="edit" onclick='editStudent(${JSON.stringify(s)})'>تعديل</button>
        <button class="del" onclick="deleteStudent('${s.id}')">حذف</button>
      </td>
    </tr>
  `).join('');
}

function openModal(){
  editingId = null;
  document.getElementById('modalTitle').textContent = 'إضافة طالب';
  ['f_id','f_name','f_seat','f_committee','f_location','f_grade','f_class'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f_id').disabled = false;
  document.getElementById('modalBg').style.display = 'flex';
}

function editStudent(s){
  editingId = s.id;
  document.getElementById('modalTitle').textContent = 'تعديل طالب';
  document.getElementById('f_id').value = s.id;
  document.getElementById('f_id').disabled = true;
  document.getElementById('f_name').value = s.name;
  document.getElementById('f_seat').value = s.seat;
  document.getElementById('f_committee').value = s.committee;
  document.getElementById('f_location').value = s.location;
  document.getElementById('f_grade').value = s.grade;
  document.getElementById('f_class').value = s.class;
  document.getElementById('modalBg').style.display = 'flex';
}

function closeModal(){
  document.getElementById('modalBg').style.display = 'none';
}

async function saveStudent(){
  const payload = {
    id: document.getElementById('f_id').value.trim(),
    name: document.getElementById('f_name').value.trim(),
    seat: document.getElementById('f_seat').value.trim(),
    committee: document.getElementById('f_committee').value.trim(),
    location: document.getElementById('f_location').value.trim(),
    grade: document.getElementById('f_grade').value.trim(),
    class: document.getElementById('f_class').value.trim(),
  };

  const res = await fetch('/api/admin/students', {
    method: editingId ? 'PUT' : 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  });

  if(res.ok){
    closeModal();
    loadStudents();
    loadStats();
  } else {
    alert('حدث خطأ، تحقق من البيانات');
  }
}

async function deleteStudent(id){
  if(!confirm('تأكيد حذف الطالب؟')) return;
  await fetch(`/api/admin/students?id=${encodeURIComponent(id)}`, { method:'DELETE' });
  loadStudents();
  loadStats();
}

document.getElementById('passwordInput').addEventListener('keydown', e => {
  if(e.key === 'Enter') login();
});

checkAuth();
</script>
</body>
</html>
