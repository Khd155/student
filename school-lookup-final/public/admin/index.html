<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم المشرف</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}

body {
  min-height:100vh;
  font-family:'Segoe UI',Tahoma,Arial,sans-serif;
  direction:rtl;
  background: linear-gradient(120deg, #4a7fa5 0%, #4aad96 100%);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:32px 16px 60px;
}

.header {
  text-align:center;
  margin-bottom:28px;
  color:#fff;
}
.header h1 { font-size:22px; font-weight:700; margin-bottom:4px; }
.header p { font-size:13px; color:rgba(255,255,255,.75); }

.card {
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.25);
  border-radius:20px;
  padding:28px 24px;
  width:100%;
}

.login-card { max-width:380px; margin-top:60px; }
.login-card .card-title { font-size:15px; font-weight:600; color:#fff; margin-bottom:16px; text-align:center; }
.field { margin-bottom:14px; }
.field label { display:block; font-size:12px; color:rgba(255,255,255,.75); margin-bottom:6px; }
input[type=password], input[type=text], input[type=file], select {
  width:100%;
  background:rgba(255,255,255,.15);
  border:1.5px solid rgba(255,255,255,.3);
  border-radius:10px;
  padding:0 14px;
  height:44px;
  font-size:14px;
  color:#fff;
  outline:none;
  font-family:inherit;
}
input[type=file] { padding:8px 14px; height:auto; }
select option { color:#111; }
input::placeholder { color:rgba(255,255,255,.5); }
input:focus, select:focus { border-color:rgba(255,255,255,.7); background:rgba(255,255,255,.22); }

.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:rgba(255,255,255,.9);
  color:#2d6a7a;
  border:none;
  border-radius:10px;
  padding:0 18px;
  height:42px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:.15s;
}
.btn:hover { background:#fff; transform:translateY(-1px); }
.btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
.btn-outline {
  background:rgba(255,255,255,.12);
  color:#fff;
  border:1.5px solid rgba(255,255,255,.4);
}
.btn-outline:hover { background:rgba(255,255,255,.22); }
.btn-danger { background:#fca5a5; color:#7f1d1d; }
.btn-danger:hover { background:#f87171; }
.btn-small { height:32px; padding:0 12px; font-size:12px; border-radius:8px; }

.error-msg { color:#fecaca; font-size:12px; margin-top:8px; text-align:center; min-height:16px; }

.app { width:100%; max-width:1100px; display:none; flex-direction:column; gap:20px; }
.app.visible { display:flex; }

.topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.topbar .tabs { display:flex; gap:8px; flex-wrap:wrap; }
.tab-btn {
  background:rgba(255,255,255,.12);
  color:#fff;
  border:1.5px solid rgba(255,255,255,.25);
  border-radius:10px;
  padding:0 16px;
  height:38px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}
.tab-btn.active { background:#fff; color:#2d6a7a; }

.panel { display:none; }
.panel.active { display:block; }

.section-title { color:#fff; font-size:15px; font-weight:700; margin-bottom:14px; }

.sheet-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.sheet-tab {
  background:rgba(255,255,255,.12); color:#fff; border:1.5px solid rgba(255,255,255,.3);
  border-radius:8px; padding:6px 14px; font-size:13px; cursor:pointer;
}
.sheet-tab.active { background:#fff; color:#2d6a7a; }

.summary-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin:16px 0; }
.summary-item { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:10px; padding:12px 14px; }
.summary-item .n { font-size:20px; font-weight:800; color:#fff; }
.summary-item .l { font-size:12px; color:rgba(255,255,255,.7); margin-top:2px; }

.mode-row { display:flex; gap:18px; align-items:center; margin:14px 0; flex-wrap:wrap; }
.mode-row label { color:#fff; font-size:13px; display:flex; align-items:center; gap:6px; cursor:pointer; }

table { width:100%; border-collapse:collapse; font-size:13px; color:#fff; }
thead th {
  text-align:right; padding:10px 12px; font-size:12px; color:rgba(255,255,255,.7);
  border-bottom:1px solid rgba(255,255,255,.2); white-space:nowrap;
}
tbody td { padding:9px 12px; border-bottom:1px solid rgba(255,255,255,.1); white-space:nowrap; }
tbody tr:hover { background:rgba(255,255,255,.05); }
.table-wrap { overflow-x:auto; border-radius:12px; }

.switch { position:relative; display:inline-block; width:42px; height:24px; }
.switch input { opacity:0; width:0; height:0; }
.slider {
  position:absolute; cursor:pointer; inset:0; background:rgba(255,255,255,.25);
  border-radius:24px; transition:.2s;
}
.slider:before {
  content:""; position:absolute; height:18px; width:18px; right:3px; bottom:3px;
  background:#fff; border-radius:50%; transition:.2s;
}
.switch input:checked + .slider { background:#4ade80; }
.switch input:checked + .slider:before { transform:translateX(-18px); }

.filters { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
.filters > * { flex:1; min-width:140px; }
.filters .btn { flex:0 0 auto; }

.pagination { display:flex; justify-content:center; align-items:center; gap:10px; margin-top:16px; color:#fff; font-size:13px; }

.edit-input {
  width:100%; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3);
  border-radius:6px; padding:4px 8px; color:#fff; font-size:13px;
}

.toast {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:#1e293b; color:#fff; padding:12px 20px; border-radius:10px;
  font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.3); z-index:100;
  opacity:0; pointer-events:none; transition:.25s;
}
.toast.show { opacity:1; }

.spinner-inline {
  width:16px;height:16px;border:2.5px solid rgba(45,106,122,.3);
  border-top-color:#2d6a7a;border-radius:50%;
  display:inline-block; animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.hint { font-size:12px; color:rgba(255,255,255,.6); margin-top:6px; }

@media(max-width:600px){ .card{padding:20px 16px} .header h1{font-size:18px} }
</style>
</head>
<body>

<div class="header">
  <h1>لوحة تحكم المشرف</h1>
  <p>استعلام الطلاب عن الفصول</p>
</div>

<!-- LOGIN -->
<div class="card login-card" id="loginCard">
  <div class="card-title">تسجيل الدخول</div>
  <div class="field">
    <label>كلمة المرور</label>
    <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور" autocomplete="off">
  </div>
  <button class="btn" style="width:100%" id="loginBtn" onclick="doLogin()">دخول</button>
  <div class="error-msg" id="loginError"></div>
</div>

<!-- APP -->
<div class="app" id="app">
  <div class="topbar">
    <div class="tabs">
      <button class="tab-btn active" data-tab="import" onclick="switchTab('import')">استيراد البيانات</button>
      <button class="tab-btn" data-tab="visibility" onclick="switchTab('visibility')">التحكم بالفصول</button>
      <button class="tab-btn" data-tab="students" onclick="switchTab('students')">إدارة الطلاب</button>
    </div>
    <button class="btn btn-outline btn-small" onclick="doLogout()">تسجيل الخروج</button>
  </div>

  <!-- IMPORT PANEL -->
  <div class="card panel active" id="panel-import">
    <div class="section-title">رفع واستيراد ملف Excel</div>
    <div class="field">
      <label>اختر ملف Excel (نظام نور)</label>
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" onchange="handleFile(event)">
    </div>
    <div class="hint">الأعمدة المتوقعة: رقم الطالب، اسم الطالب، رقم الصف، الفصل، الجوال (اختياري)</div>

    <div id="sheetTabsWrap" style="display:none">
      <div class="section-title" style="margin-top:20px">اختر ورقة العمل</div>
      <div class="sheet-tabs" id="sheetTabs"></div>
    </div>

    <div id="previewWrap" style="display:none">
      <div class="section-title" style="margin-top:10px">معاينة البيانات</div>
      <div class="summary-grid" id="summaryGrid"></div>

      <div class="mode-row">
        <label><input type="radio" name="importMode" value="replace_all" checked onchange="onModeChange()"> استبدال كامل البيانات</label>
        <label><input type="radio" name="importMode" value="replace_grade" onchange="onModeChange()"> تحديث صف دراسي محدد فقط</label>
        <select id="targetGradeSelect" style="max-width:220px;display:none"></select>
      </div>

      <button class="btn" id="confirmImportBtn" onclick="confirmImport()">تأكيد الاستيراد والحفظ</button>
      <div class="error-msg" id="importError"></div>
    </div>
  </div>

  <!-- VISIBILITY PANEL -->
  <div class="card panel" id="panel-visibility">
    <div class="section-title">تفعيل / تعطيل الاستعلام لكل صف وفصل</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>الصف</th><th>الفصل</th><th>عدد الطلاب</th><th>مفعّل</th></tr></thead>
        <tbody id="visibilityBody"></tbody>
      </table>
    </div>
  </div>

  <!-- STUDENTS PANEL -->
  <div class="card panel" id="panel-students">
    <div class="section-title">إدارة الطلاب</div>
    <div class="filters">
      <select id="filterGrade" onchange="reloadStudents(1)"><option value="">كل الصفوف</option></select>
      <select id="filterClass" onchange="reloadStudents(1)"><option value="">كل الفصول</option></select>
      <input type="text" id="filterSearch" placeholder="بحث برقم الهوية أو الاسم" oninput="debouncedSearch()">
      <button class="btn btn-outline" onclick="exportExcel()">تصدير Excel</button>
      <button class="btn" onclick="showAddRow()">+ إضافة طالب</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>رقم الهوية</th><th>الاسم</th><th>الصف</th><th>الفصل</th><th>الجوال</th><th></th></tr></thead>
        <tbody id="studentsBody"></tbody>
      </table>
    </div>
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GRADE_CODE_MAP = { 330: 'الثالث الابتدائي', 430: 'الرابع الابتدائي', 530: 'الخامس الابتدائي', 630: 'السادس الابتدائي' };
const COLUMN_ALIASES = {
  id: ['رقم الطالب', 'رقم الهوية'],
  name: ['اسم الطالب', 'الاسم'],
  grade: ['رقم الصف', 'الصف'],
  class: ['الفصل'],
  phone: ['الجوال', 'رقم الجوال'],
};

let currentTab = 'import';
let workbook = null;
let parsedRows = [];
let studentsPage = 1;
let studentsTotal = 0;
const PAGE_SIZE = 50;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function api(path, opts) {
  const res = await fetch(path, Object.assign({ credentials: 'same-origin' }, opts || {}));
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) {
    const err = new Error((data && data.error) || 'request_failed');
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

async function checkSession() {
  try {
    const data = await api('/api/admin/session');
    if (data.authenticated) showApp();
  } catch (_) {}
}

function showApp() {
  document.getElementById('loginCard').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  loadVisibility();
  loadGradeOptions();
  reloadStudents(1);
}

async function doLogin() {
  const password = document.getElementById('passwordInput').value;
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  btn.disabled = true;
  try {
    await api('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
    showApp();
  } catch (e) {
    errEl.textContent = e.status === 429 ? 'محاولات كثيرة، حاول لاحقاً' : 'كلمة المرور غير صحيحة';
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogout() {
  try { await api('/api/admin/logout', { method: 'POST' }); } catch (_) {}
  location.reload();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
}

/* ---------- IMPORT ---------- */

function normalizeGrade(raw) {
  const digits = String(raw).replace(/[^0-9]/g, '');
  const num = parseInt(digits, 10);
  return GRADE_CODE_MAP[num] || String(raw).trim();
}

function findColumnIndex(headerRow, aliases) {
  for (let i = 0; i < headerRow.length; i++) {
    const cell = String(headerRow[i] || '').trim();
    if (aliases.includes(cell)) return i;
  }
  return -1;
}

function handleFile(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    workbook = XLSX.read(e.target.result, { type: 'array' });
    const tabsWrap = document.getElementById('sheetTabsWrap');
    const tabsEl = document.getElementById('sheetTabs');
    tabsEl.innerHTML = '';
    workbook.SheetNames.forEach((name, idx) => {
      const btn = document.createElement('button');
      btn.className = 'sheet-tab' + (idx === 0 ? ' active' : '');
      btn.textContent = name;
      btn.onclick = () => {
        document.querySelectorAll('.sheet-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        parseSheet(name);
      };
      tabsEl.appendChild(btn);
    });
    tabsWrap.style.display = workbook.SheetNames.length > 1 ? 'block' : 'none';
    parseSheet(workbook.SheetNames[0]);
  };
  reader.readAsArrayBuffer(file);
}

function parseSheet(sheetName) {
  const sheet = workbook.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
  if (rows.length < 2) { toast('الورقة فارغة أو بدون بيانات'); return; }

  const header = rows[0];
  const idIdx = findColumnIndex(header, COLUMN_ALIASES.id);
  const nameIdx = findColumnIndex(header, COLUMN_ALIASES.name);
  const gradeIdx = findColumnIndex(header, COLUMN_ALIASES.grade);
  const classIdx = findColumnIndex(header, COLUMN_ALIASES.class);
  const phoneIdx = findColumnIndex(header, COLUMN_ALIASES.phone);

  if (idIdx === -1 || nameIdx === -1 || gradeIdx === -1 || classIdx === -1) {
    toast('تعذر التعرف على أعمدة الملف، تحقق من رؤوس الأعمدة');
    document.getElementById('previewWrap').style.display = 'none';
    return;
  }

  parsedRows = [];
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    const id = String(row[idIdx] || '').trim();
    const name = String(row[nameIdx] || '').trim();
    if (!id || !name) continue;
    parsedRows.push({
      id, name,
      grade: normalizeGrade(row[gradeIdx]),
      class: String(row[classIdx] || '').trim(),
      phone: phoneIdx !== -1 ? String(row[phoneIdx] || '').trim() : '',
    });
  }

  renderPreview();
}

function renderPreview() {
  const wrap = document.getElementById('previewWrap');
  wrap.style.display = parsedRows.length ? 'block' : 'none';
  if (!parsedRows.length) { toast('لم يتم العثور على صفوف صالحة'); return; }

  const byGrade = {};
  parsedRows.forEach(r => { byGrade[r.grade] = (byGrade[r.grade] || 0) + 1; });

  const grid = document.getElementById('summaryGrid');
  grid.innerHTML = `<div class="summary-item"><div class="n">${parsedRows.length}</div><div class="l">إجمالي الطلاب</div></div>` +
    Object.entries(byGrade).map(([g, c]) => `<div class="summary-item"><div class="n">${c}</div><div class="l">${escHtml(g)}</div></div>`).join('');

  const select = document.getElementById('targetGradeSelect');
  select.innerHTML = Object.keys(byGrade).map(g => `<option value="${escHtml(g)}">${escHtml(g)}</option>`).join('');

  document.getElementById('importError').textContent = '';
}

function onModeChange() {
  const mode = document.querySelector('input[name=importMode]:checked').value;
  document.getElementById('targetGradeSelect').style.display = mode === 'replace_grade' ? 'block' : 'none';
}

async function confirmImport() {
  const mode = document.querySelector('input[name=importMode]:checked').value;
  const grade = mode === 'replace_grade' ? document.getElementById('targetGradeSelect').value : undefined;
  const btn = document.getElementById('confirmImportBtn');
  const errEl = document.getElementById('importError');
  errEl.textContent = '';

  const msg = mode === 'replace_all'
    ? `سيتم استبدال جميع بيانات الطلاب الحالية بعدد ${parsedRows.length} طالب. هل أنت متأكد؟`
    : `سيتم استبدال بيانات صف "${grade}" فقط. هل أنت متأكد؟`;
  if (!confirm(msg)) return;

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-inline"></span> جارٍ الحفظ...';
  try {
    const data = await api('/api/admin/import', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode, grade, rows: parsedRows }),
    });
    toast(`تم استيراد ${data.imported} طالب بنجاح`);
    loadVisibility();
    loadGradeOptions();
    reloadStudents(1);
  } catch (e) {
    errEl.textContent = 'حدث خطأ أثناء الاستيراد';
  } finally {
    btn.disabled = false;
    btn.textContent = 'تأكيد الاستيراد والحفظ';
  }
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = String(s ?? '');
  return d.innerHTML;
}

/* ---------- VISIBILITY ---------- */

async function loadVisibility() {
  try {
    const data = await api('/api/admin/visibility');
    const body = document.getElementById('visibilityBody');
    body.innerHTML = data.items.map(item => `
      <tr>
        <td>${escHtml(item.grade)}</td>
        <td>فصل ${escHtml(item.class)}</td>
        <td>${item.student_count}</td>
        <td>
          <label class="switch">
            <input type="checkbox" ${item.enabled ? 'checked' : ''} onchange="toggleVisibility('${encodeURIComponent(item.grade)}','${encodeURIComponent(item.class)}',this.checked)">
            <span class="slider"></span>
          </label>
        </td>
      </tr>`).join('');
  } catch (_) {}
}

async function toggleVisibility(gradeEnc, classEnc, enabled) {
  const grade = decodeURIComponent(gradeEnc);
  const klass = decodeURIComponent(classEnc);
  try {
    await api('/api/admin/visibility', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ grade, class: klass, enabled }),
    });
    toast(enabled ? 'تم تفعيل الاستعلام' : 'تم تعطيل الاستعلام');
  } catch (_) {
    toast('حدث خطأ، حاول مرة أخرى');
    loadVisibility();
  }
}

/* ---------- STUDENTS ---------- */

async function loadGradeOptions() {
  try {
    const data = await api('/api/admin/visibility');
    const grades = [...new Set(data.items.map(i => i.grade))];
    const classes = [...new Set(data.items.map(i => i.class))];
    const gSel = document.getElementById('filterGrade');
    const cSel = document.getElementById('filterClass');
    const currentG = gSel.value, currentC = cSel.value;
    gSel.innerHTML = '<option value="">كل الصفوف</option>' + grades.map(g => `<option value="${escHtml(g)}">${escHtml(g)}</option>`).join('');
    cSel.innerHTML = '<option value="">كل الفصول</option>' + classes.map(c => `<option value="${escHtml(c)}">فصل ${escHtml(c)}</option>`).join('');
    gSel.value = currentG; cSel.value = currentC;
  } catch (_) {}
}

let searchDebounceTimer = null;
function debouncedSearch() {
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(() => reloadStudents(1), 350);
}

async function reloadStudents(page) {
  studentsPage = page || studentsPage;
  const grade = document.getElementById('filterGrade').value;
  const klass = document.getElementById('filterClass').value;
  const q = document.getElementById('filterSearch').value.trim();

  const params = new URLSearchParams({ page: studentsPage, pageSize: PAGE_SIZE });
  if (grade) params.set('grade', grade);
  if (klass) params.set('class', klass);
  if (q) params.set('q', q);

  try {
    const data = await api('/api/admin/students?' + params.toString());
    studentsTotal = data.total;
    renderStudents(data.students);
    renderPagination();
  } catch (_) {}
}

function renderStudents(students) {
  const body = document.getElementById('studentsBody');
  body.innerHTML = students.map(s => `
    <tr data-id="${s._id}">
      <td>${escHtml(s.id)}</td>
      <td>${escHtml(s.name)}</td>
      <td>${escHtml(s.grade)}</td>
      <td>${escHtml(s.class)}</td>
      <td>${escHtml(s.phone || '-')}</td>
      <td style="display:flex;gap:6px">
        <button class="btn btn-outline btn-small" onclick="editRow(${s._id})">تعديل</button>
        <button class="btn btn-danger btn-small" onclick="deleteRow(${s._id})">حذف</button>
      </td>
    </tr>`).join('');
}

function renderPagination() {
  const totalPages = Math.max(1, Math.ceil(studentsTotal / PAGE_SIZE));
  const el = document.getElementById('pagination');
  el.innerHTML = `
    <button class="btn btn-outline btn-small" ${studentsPage <= 1 ? 'disabled' : ''} onclick="reloadStudents(${studentsPage - 1})">السابق</button>
    <span>صفحة ${studentsPage} من ${totalPages} (${studentsTotal} طالب)</span>
    <button class="btn btn-outline btn-small" ${studentsPage >= totalPages ? 'disabled' : ''} onclick="reloadStudents(${studentsPage + 1})">التالي</button>`;
}

function editRow(id) {
  const row = document.querySelector(`tr[data-id="${id}"]`);
  const cells = row.querySelectorAll('td');
  const values = [cells[0].textContent, cells[1].textContent, cells[2].textContent, cells[3].textContent, cells[4].textContent === '-' ? '' : cells[4].textContent];
  row.innerHTML = `
    <td><input class="edit-input" value="${escHtml(values[0])}" data-f="id"></td>
    <td><input class="edit-input" value="${escHtml(values[1])}" data-f="name"></td>
    <td><input class="edit-input" value="${escHtml(values[2])}" data-f="grade"></td>
    <td><input class="edit-input" value="${escHtml(values[3])}" data-f="class"></td>
    <td><input class="edit-input" value="${escHtml(values[4])}" data-f="phone"></td>
    <td style="display:flex;gap:6px">
      <button class="btn btn-small" onclick="saveRow(${id})">حفظ</button>
      <button class="btn btn-outline btn-small" onclick="reloadStudents(${studentsPage})">إلغاء</button>
    </td>`;
}

async function saveRow(id) {
  const row = document.querySelector(`tr[data-id="${id}"]`);
  const inputs = row.querySelectorAll('input[data-f]');
  const payload = { _id: id };
  inputs.forEach(inp => { payload[inp.dataset.f] = inp.value.trim(); });

  try {
    await api('/api/admin/students', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    toast('تم الحفظ');
    reloadStudents(studentsPage);
    loadVisibility();
    loadGradeOptions();
  } catch (_) {
    toast('حدث خطأ أثناء الحفظ');
  }
}

async function deleteRow(id) {
  if (!confirm('هل أنت متأكد من حذف هذا الطالب؟')) return;
  try {
    await api('/api/admin/students?_id=' + id, { method: 'DELETE' });
    toast('تم الحذف');
    reloadStudents(studentsPage);
    loadVisibility();
    loadGradeOptions();
  } catch (_) {
    toast('حدث خطأ أثناء الحذف');
  }
}

function showAddRow() {
  const body = document.getElementById('studentsBody');
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input class="edit-input" placeholder="رقم الهوية" data-f="id"></td>
    <td><input class="edit-input" placeholder="الاسم" data-f="name"></td>
    <td><input class="edit-input" placeholder="الصف" data-f="grade"></td>
    <td><input class="edit-input" placeholder="الفصل" data-f="class"></td>
    <td><input class="edit-input" placeholder="الجوال" data-f="phone"></td>
    <td style="display:flex;gap:6px">
      <button class="btn btn-small" id="saveNewBtn">حفظ</button>
      <button class="btn btn-outline btn-small" onclick="reloadStudents(studentsPage)">إلغاء</button>
    </td>`;
  body.prepend(tr);
  tr.querySelector('#saveNewBtn').onclick = async () => {
    const inputs = tr.querySelectorAll('input[data-f]');
    const payload = {};
    inputs.forEach(inp => { payload[inp.dataset.f] = inp.value.trim(); });
    try {
      await api('/api/admin/students', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      toast('تمت الإضافة');
      reloadStudents(1);
      loadVisibility();
      loadGradeOptions();
    } catch (_) {
      toast('تعذرت الإضافة، تحقق من الحقول');
    }
  };
}

async function exportExcel() {
  const grade = document.getElementById('filterGrade').value;
  const klass = document.getElementById('filterClass').value;
  const q = document.getElementById('filterSearch').value.trim();
  const params = new URLSearchParams({ page: 1, pageSize: 5000 });
  if (grade) params.set('grade', grade);
  if (klass) params.set('class', klass);
  if (q) params.set('q', q);

  try {
    const data = await api('/api/admin/students?' + params.toString());
    const sheetData = data.students.map(s => ({
      'رقم الطالب': s.id, 'اسم الطالب': s.name, 'رقم الصف': s.grade, 'الفصل': s.class, 'الجوال': s.phone || '',
    }));
    const ws = XLSX.utils.json_to_sheet(sheetData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'الطلاب');
    XLSX.writeFile(wb, 'بيانات_الطلاب.xlsx');
  } catch (_) {
    toast('تعذر تصدير الملف');
  }
}

checkSession();
</script>
</body>
</html>
